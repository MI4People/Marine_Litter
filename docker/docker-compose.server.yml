services:
  marine_litter:
    image: marine_litter:devcontainer
    command: ["python", "scripts/run_all.py", "-l", "INFO"]
    restart: "no"
    gpus: all
    volumes:
      - /home/workspace/marine_litter_project/Marine_Litter:/marine_litter:rw
      - /home/workspace/marine_litter_project/secrets:/marine_litter/secrets:ro
      - /home/workspace/marine_litter_project/data/dates.json:/marine_litter/resources/dates.json:rw
    environment:
      - ML_DEVICE=cuda
      - ML_DAYS_BEFORE=2
      - ML_ORDER_WORKERS=10
      - ML_PREDICT_WORKERS=3
